[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marktext"
version = "1.2.0"
description = "Statistical watermarking and detection of LLM-generated text with Qwen2.5."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "streamlit>=1.50",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
marktext = "main:main"

[tool.setuptools]
py-modules = ["main", "app", "engine", "history", "config", "experiment", "verdict"]
packages = ["classroom", "ui"]

[tool.setuptools.package-data]
classroom = ["demo_texts/*.txt"]