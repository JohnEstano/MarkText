[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marktext"
version = "1.2.0"
description = "Statistical watermarking and detection of LLM-generated text with Qwen2.5."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# ranges here; requirements.txt pins the exact versions the tests pass with
# (scorer.py reads transformers' green lists: tests/test_golden.py checks them)
dependencies = [
    "torch>=2.4",
    "transformers>=5.17,<6",
    "streamlit>=1.64,<2",
    "pandas>=2.2",
    "altair>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
marktext = "main:main"

[tool.setuptools]
py-modules = ["main", "app", "engine", "scorer", "locks", "history", "config", "experiment", "verdict"]
packages = ["classroom", "ui"]

[tool.setuptools.package-data]
classroom = ["demo_texts/*.txt"]