# Runs the test suite on every push and pull request. No model is loaded:
# the tests use a fake engine, and tests/test_golden.py downloads only the
# Qwen tokenizer and configuration (about 10 MB) to pin the green lists.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install MarkText's dependencies
        run: pip install -r requirements.txt pytest==9.1.1
      - name: Run the tests
        run: pytest -q
